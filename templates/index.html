<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRD Manager</title>
  <link rel="stylesheet" href="/static/style.css?v=9" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">P</div>
        <div>
          <div class="brand-title">PRD Manager</div>
          <div class="brand-subtitle">여러 PRD와 스키마 관리</div>
        </div>
      </div>

      <div class="side-section">
        <div class="side-label">PRD 문서</div>
        <select id="prdSelect" class="file-select" aria-label="PRD 문서 선택"></select>
      </div>

      <div class="side-section">
        <div class="side-label">Schema 문서</div>
        <select id="schemaSelect" class="file-select" aria-label="스키마 파일 선택"></select>
      </div>

      <div class="side-section">
        <div class="side-label">목차</div>
        <nav id="toc" class="toc"></nav>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>PRD Workspace</h1>
          <p id="currentPrdLabel">prds 폴더의 문서를 자동으로 읽는 중입니다.</p>
        </div>
        <div class="actions">
          <button id="themeBtn" class="btn ghost">Dark</button>
          <button id="reloadBtn" class="btn ghost">Reload</button>
          <button id="saveBtn" class="btn primary">Save PRD</button>
        </div>
      </header>

      <section class="tabs">
        <button class="tab active" data-tab="preview">Preview</button>
        <button class="tab" data-tab="edit">Edit</button>
        <button class="tab" data-tab="split">Split</button>
        <button class="tab" data-tab="schema">Schema</button>
      </section>

      <section class="status-row">
        <span id="status">Ready</span>
        <span id="wordCount">0 chars</span>
      </section>

      <section id="previewPanel" class="panel active">
        <article id="preview" class="markdown-body"></article>
      </section>

      <section id="editPanel" class="panel">
        <textarea id="editor" spellcheck="false"></textarea>
      </section>

      <section id="splitPanel" class="panel split-panel">
        <article id="splitPreview" class="markdown-body"></article>
        <textarea id="splitEditor" spellcheck="false"></textarea>
      </section>

      <section id="schemaPanel" class="panel">
        <div class="schema-header">
          <div>
            <h2>Schema</h2>
            <p id="currentSchemaLabel">schemas 폴더의 파일을 자동으로 읽습니다.</p>
          </div>
          <div class="schema-tools">
            <button id="reloadSchemaBtn" class="btn ghost">Reload</button>
            <button id="saveSchemaBtn" class="btn primary">Save Schema</button>
          </div>
        </div>
        <textarea id="schemaEditor" class="schema-editor" spellcheck="false"></textarea>
      </section>
    </main>
  </div>

  <script src="/static/app.js?v=9"></script>
</body>
</html>
